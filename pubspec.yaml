name: local_transfer
description: "A peer-to-peer tool for moving text, files, and clipboard content between devices on a local network. No server, no account, no cloud."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.53+53

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The Material widgets' own words — the text selection menu, dialog semantics
  # — come from here, so a screen can be Chinese without every field still
  # offering "Cut" and "Paste". It also brings the generated `AppLocalizations`
  # its delegates and `intl`, which the generated code imports.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  cryptography: ^2.9.0

  # The OS's own file and image pickers, so that "选择文件" opens the real
  # Windows dialog instead of asking the user to type a path. `file_selector`
  # is the Flutter team's plugin and is federated, so Windows, macOS, Linux and
  # Android each get a native picker without a platform channel of our own.
  file_selector: ^1.1.0

  # Files dropped onto the window from Explorer. Flutter's own `DragTarget`
  # only sees drags that started inside the Flutter app — an external drop
  # arrives as the platform's `WM_DROPFILES` and never becomes a Flutter drag
  # at all — so this plugin exists to bridge that, which the app cannot do from
  # Dart alone.
  desktop_drop: ^0.8.4

  # Pasting a file or an image into the composer. Flutter's own `Clipboard`
  # reads and writes *text* on every platform and nothing else, so a screenshot
  # or a file copied in Explorer is invisible to it; this plugin reads the
  # desktop clipboard's file list and its bitmap.
  pasteboard: ^0.5.0

  # The screenshot feature's extra windows — the capture overlay, the history
  # strip, the annotation editor and each pinned image — each run in their own
  # Flutter engine, because a window that must cover the whole screen and stay
  # above every other application cannot be a route inside the main window.
  desktop_multi_window: ^0.3.1

  # Sizes, moves, hides and always-on-top's the windows above, per engine.
  # Held at 0.5.x deliberately: 0.6.x is days old and rewrites the whole API
  # onto nativeapi, which this feature does not need.
  window_manager: 0.5.2

  # The global hotkey that summons the capture overlay from any application.
  # Held at 0.2.x for the same reason: 0.3.x is a days-old rewrite.
  hotkey_manager: 0.2.3

  # Direct Win32 access for what no plugin offers: enumerating other
  # applications' windows for window-mode capture, reading the virtual screen
  # metrics, writing a bitmap to the clipboard, and the WS_EX_TRANSPARENT
  # click-through a pinned image needs.
  win32: ^6.4.0

  # PNG encode/decode and DIB conversion for the captures and the clipboard.
  image: ^4.10.1

  # `calloc` for the Win32 calls above; declared directly because importing a
  # transitive dependency is exactly what `depend_on_referenced_packages`
  # exists to catch.
  ffi: ^2.2.0

  # Path joining for the screenshot library's files.
  path: ^1.9.0

  # HTTP server for link-based file transfer.
  shelf: ^1.4.1
  shelf_static: ^1.1.2
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.31.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates `lib/l10n/generated` from the ARB files on every `flutter test`
  # and `flutter build`, so a string that is added to the template without a
  # translation is a build-time difference rather than a runtime surprise.
  generate: true

  # Assets for link transfer web page.
  assets:
    - assets/link_transfer/index.html
    # The bundled bubble skins the picker offers under 「内置图片」.
    - assets/bubble_skins/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
